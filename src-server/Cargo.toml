[package]
name = "investwise-server"
version = "2.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full", "timeout", "request-id", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "1"
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
serde_with = "3"
chrono = { version = "0.4", features = ["serde"] }
serde_urlencoded = "0.7"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.21"
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-core = "0.3"
semver = "1"
hex = "0.4"

# Addons upload & signature verification
tar = "0.4"
flate2 = "1.0"
ed25519-dalek = "1"
sha2 = "0.10"

# path dependency to core
investwise_core = { path = "../src-core", package = "investwise_core" }

hyper = { version = "0.14", features = ["full"] }

[features]
default = []

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
